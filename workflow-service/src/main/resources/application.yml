server: {port: 8085}
spring:
 application: {name: workflow-service}
 datasource: {url: "${DB_URL:jdbc:postgresql://localhost:5433/workflow_db}", username: "${DB_USER:soa}", password: "${DB_PASSWORD:soa_demo}"}
 jpa: {hibernate: {ddl-auto: update}, open-in-view: false}
 kafka:
  bootstrap-servers: "${KAFKA_BOOTSTRAP:localhost:9092}"
  consumer: {group-id: pharmacy-workflow, auto-offset-reset: earliest, key-deserializer: org.apache.kafka.common.serialization.StringDeserializer, value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer, properties: {spring.json.trusted.packages: "*", spring.json.value.default.type: java.util.LinkedHashMap}}
eureka: {client: {service-url: {defaultZone: "${EUREKA_URL:http://localhost:8761/eureka/}"}}}
