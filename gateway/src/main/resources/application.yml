
server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
              - "http://localhost:8080"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      routes:
        - id: auth
          uri: lb://auth-service
          predicates:
            - Path=/auth/**

        - id: lots
          uri: lb://productlot-service
          predicates:
            - Path=/lots/**

        - id: stock
          uri: lb://shelfstock-service
          predicates:
            - Path=/stock/**

        - id: recall
          uri: lb://recall-service
          predicates:
            - Path=/recall/**

        - id: workflow
          uri: lb://workflow-service
          predicates:
            - Path=/workflow/**

eureka:
  client:
    service-url:
      defaultZone: "${EUREKA_URL:http://localhost:8761/eureka/}"
