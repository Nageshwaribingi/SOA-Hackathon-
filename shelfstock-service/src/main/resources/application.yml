server:
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: shelfstock-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/shelfstock_db}
    username: ${DB_USER:soa}
    password: ${DB_PASSWORD:soa_demo}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
